<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parts of Speech Mastery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Welcome Screen -->

        <section class="hero" id="welcome-screen">

            <h1>Parts of Speech Mastery</h1>

            <p>
                Learn how to identify the seven parts of speech
                by understanding the job each word does in a sentence.
            </p>

            <button class="start-button" onclick="startPractice()">
                Start Practice
            </button>

        </section>


        <!-- Practice Screen -->

        <section class="hero" id="practice-screen" style="display: none;">

            <p>Question 1</p>

            <h2 id="sentence">
                The students study every evening.
            </h2>

            <p>What is the part of speech of <strong>study</strong>?</p>

            <div class="answers">

                <button onclick="checkAnswer('Noun')">
                    Noun
                </button>

                <button onclick="checkAnswer('Verb')">
                    Verb
                </button>

                <button onclick="checkAnswer('Adjective')">
                    Adjective
                </button>

                <button onclick="checkAnswer('Adverb')">
                    Adverb
                </button>

            </div>

            <p id="feedback"></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
