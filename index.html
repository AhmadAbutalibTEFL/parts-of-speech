<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parts of Speech Mastery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Welcome Screen -->

        <section class="hero" id="welcome-screen">

            <h1>Parts of Speech Mastery</h1>

            <p>
                Learn how to identify the seven parts of speech
                by understanding the job each word does in a sentence.
            </p>

            <button class="start-button" onclick="startPractice()">
                Start Practice
            </button>

        </section>


<!-- Practice Screen -->

<section class="hero" id="practice-screen" style="display: none;">

    <p id="question-number">Question 1 of 8</p>

    <h2 id="sentence">
        The students study every evening.
    </h2>

    <p>
        What is the part of speech of
        <strong id="target-word">study</strong>?
    </p>


    <div class="answers">

        <button class="answer-button" onclick="checkAnswer('Noun')">
            Noun
        </button>

        <button class="answer-button" onclick="checkAnswer('Verb')">
            Verb
        </button>

        <button class="answer-button" onclick="checkAnswer('Pronoun')">
            Pronoun
        </button>

        <button class="answer-button" onclick="checkAnswer('Preposition')">
            Preposition
        </button>

        <button class="answer-button" onclick="checkAnswer('Conjunction')">
            Conjunction
        </button>

        <button class="answer-button" onclick="checkAnswer('Adverb')">
            Adverb
        </button>

        <button class="answer-button" onclick="checkAnswer('Adjective')">
            Adjective
        </button>

    </div>


    <p id="feedback"></p>


    <button
        id="next-button"
        class="start-button"
        onclick="nextQuestion()"
        style="display: none;">
        Next Question
    </button>

</section>
        <!-- Results Screen -->

<section class="hero" id="results-screen" style="display: none;">

    <h2>Quiz Complete!</h2>

    <p>Your score:</p>

    <div id="score" class="score">
        0 / 8
    </div>

    <button class="start-button" onclick="restartQuiz()">
        Try Again
    </button>

</section>
    </main>


    <script src="script.js"></script>

</body>
</html>
